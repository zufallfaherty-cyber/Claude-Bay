<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>更新 Claude &amp; Bay</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #F7F6F1; color: #3F463A;
    font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    text-align: center;
  }
  .card { max-width: 320px; }
  .plant { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
  p { margin: 0 0 8px; font-size: 13.5px; color: #7C8374; }
  #status { margin-top: 18px; font-size: 14px; color: #5D6856; min-height: 22px; }
  button {
    margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 12px;
    font: 600 15px/1 inherit; color: #fff; background: #6E8C64; display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="plant">🌿</div>
    <h1>正在更新 Claude &amp; Bay</h1>
    <p>清理旧的离线缓存，然后把最新版本重新打开。</p>
    <p>只需要几秒钟。</p>
    <div id="status">正在清理…</div>
    <button id="go">手动回到首页</button>
  </div>
<script>
  const status = document.getElementById('status')
  const go = document.getElementById('go')
  go.addEventListener('click', () => location.replace('/'))

  ;(async () => {
    try {
      if (window.caches) {
        const keys = await caches.keys()
        await Promise.all(keys.map((k) => caches.delete(k)))
      }
    } catch (e) { /* ignore */ }
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations()
        await Promise.all(regs.map((r) => r.unregister()))
      }
    } catch (e) { /* ignore */ }
    status.textContent = '清理完成，正在打开最新版本…'
    go.style.display = 'inline-block'
    setTimeout(() => location.replace('/?v=' + Date.now()), 900)
  })()
</script>
</body>
</html>
